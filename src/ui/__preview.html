<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>HUD preview</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #17120e; }
  body { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
          background:
            radial-gradient(120% 90% at 50% 12%, #cfd4c8 0%, #a9b39c 34%, #8e9a76 62%, #6e7a56 100%); }
  #hud { position: fixed; inset: 0; pointer-events: none; user-select: none; z-index: 10; }
  #hud * { pointer-events: none; }
  #hud .clickable { pointer-events: auto; }
</style>
</head>
<body>
  <div id="view"></div>
  <div id="hud"></div>
  <script type="module" src="./__preview.js"></script>
</body>
</html>
